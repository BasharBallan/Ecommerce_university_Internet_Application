services:
  # Backend API Service configuration
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tic-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/config.env
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - DB_URI=mongodb://mongo-db:27017/tic_db
      - MONGO_URI=mongodb://mongo-db:27017/tic_db
      - INVENTORY_GRPC_URL=inventory-service:50051
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - PUSHER_APP_ID=app-id
      - PUSHER_APP_KEY=app-key
      - PUSHER_APP_SECRET=app-secret
      - PUSHER_HOST=soketi
      - PUSHER_PORT=6001
    volumes:
      # 1. Bind mount local backend directory to /app for real-time code changes (Hot-Reload)
      - ./backend:/app
      # 2. Prevent local node_modules from overwriting the container's node_modules
      - /app/node_modules
      # 3. Persist uploaded files and logs outside the container lifecycle
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      - redis
      - mongo-db
      - inventory-service
      - rabbitmq
      - soketi

  # Laravel gRPC Inventory Microservice
  inventory-service:
    build:
      context: ../inventory-service
      dockerfile: Dockerfile
    container_name: tic-inventory
    restart: unless-stopped
    ports:
      - "50051:50051"
      - "8001:8000"
    environment:
      - APP_KEY=base64:OX/6C8Gpdc1MisbnZijWxhdY4w0/VpMy4vOMKTwaFas=
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-inventory
      - DB_READ_HOST=mysql-inventory-replica
      - DB_PORT=3306
      - DB_DATABASE=inventory_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    volumes:
      - ./inventory-service:/app
      - /app/vendor
    depends_on:
      - mysql-inventory
      - mysql-inventory-replica

  # MySQL Dedicated Database for Inventory Microservice (Primary / Write Host)
  mysql-inventory:
    image: mysql:8.0
    container_name: tic-mysql-inventory
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-inventory-data:/var/lib/mysql

  # MySQL Read Replica for Inventory Microservice (Secondary / Read Host)
  mysql-inventory-replica:
    image: mysql:8.0
    container_name: tic-mysql-inventory-replica
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_db
    ports:
      - "3308:3306"
    volumes:
      - mysql-inventory-replica-data:/var/lib/mysql

  # Redis In-Memory Cache Service
  redis:
    image: redis:7-alpine
    container_name: tic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # MongoDB Database Service for storing collections (users, products, orders, etc.)
  mongo-db:
    image: mongo:latest
    container_name: tic-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # RabbitMQ Message Broker with Management Web Dashboard
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tic-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP Protocol
      - "15672:15672"   # Management Web UI (guest / guest)
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # Soketi WebSockets Server (Off-the-shelf Pusher Protocol v7 server)
  soketi:
    image: quay.io/soketi/soketi:1.4-16-alpine
    container_name: tic-soketi
    restart: unless-stopped
    ports:
      - "6001:6001"
    environment:
      - SOKETI_DEBUG=1
      - SOKETI_DEFAULT_APP_ID=app-id
      - SOKETI_DEFAULT_APP_KEY=app-key
      - SOKETI_DEFAULT_APP_SECRET=app-secret

  # Dedicated Asynchronous Background Worker for Order Email Processing & DLQ
  email-worker:
    image: ecommerce_university_internet_application-backend:latest
    container_name: tic-email-worker
    restart: unless-stopped
    command: ["node", "workers/emailWorker.js"]
    env_file:
      - ./backend/config.env
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - DB_URI=mongodb://mongo-db:27017/tic_db
      - MONGO_URI=mongodb://mongo-db:27017/tic_db
      - INVENTORY_GRPC_URL=inventory-service:50051
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/logs:/app/logs
    depends_on:
      - rabbitmq
      - mongo-db

volumes:
  redis-data:
  mongo-data:
  mysql-inventory-data:
  mysql-inventory-replica-data:
  rabbitmq-data:
