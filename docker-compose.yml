services:
  # Backend API Service configuration
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tic-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/config.env
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - DB_URI=mongodb://mongo-db:27017/tic_db
      - MONGO_URI=mongodb://mongo-db:27017/tic_db
      - INVENTORY_GRPC_URL=inventory-service:50051
    volumes:
      # 1. Bind mount local backend directory to /app for real-time code changes (Hot-Reload)
      - ./backend:/app
      # 2. Prevent local node_modules from overwriting the container's node_modules
      - /app/node_modules
      # 3. Persist uploaded files and logs outside the container lifecycle
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      - redis
      - mongo-db
      - inventory-service

  # Laravel gRPC Inventory Microservice
  inventory-service:
    build:
      context: ../inventory-service
      dockerfile: Dockerfile
    container_name: tic-inventory
    restart: unless-stopped
    ports:
      - "50051:50051"
      - "8001:8000"
    environment:
      - APP_KEY=base64:OX/6C8Gpdc1MisbnZijWxhdY4w0/VpMy4vOMKTwaFas=
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-inventory
      - DB_PORT=3306
      - DB_DATABASE=inventory_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - mysql-inventory

  # MySQL Dedicated Database for Inventory Microservice
  mysql-inventory:
    image: mysql:8.0
    container_name: tic-mysql-inventory
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-inventory-data:/var/lib/mysql

  # Redis In-Memory Cache Service
  redis:
    image: redis:7-alpine
    container_name: tic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # MongoDB Database Service for storing collections (users, products, orders, etc.)
  mongo-db:
    image: mongo:latest
    container_name: tic-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  redis-data:
  mongo-data:
  mysql-inventory-data:
