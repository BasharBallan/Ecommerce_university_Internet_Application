syntax = "proto3";

package inventory;

option php_namespace = "App\\Grpc\\Inventory";
option php_metadata_namespace = "App\\Grpc\\GPBMetadata";

service InventoryService {
    rpc CheckStock (StockRequest) returns (StockResponse);
    rpc ReserveStock (ReserveRequest) returns (ReserveResponse);
    rpc ReleaseStock (ReleaseRequest) returns (ReleaseResponse);
    rpc GetProduct (ProductRequest) returns (ProductResponse);
}

message StockRequest {
    string product_id = 1;
}

message StockResponse {
    bool available = 1;
    int32 quantity = 2;
    string message = 3;
}

message ReserveRequest {
    string product_id = 1;
    int32 quantity = 2;
    string order_id = 3;
}

message ReserveResponse {
    bool success = 1;
    string message = 2;
    int32 remaining = 3;
}

message ReleaseRequest {
    string product_id = 1;
    int32 quantity = 2;
    string order_id = 3;
}

message ReleaseResponse {
    bool success = 1;
    string message = 2;
}

message ProductRequest {
    string product_id = 1;
}

message ProductResponse {
    bool found = 1;
    string id = 2;
    string title = 3;
    string slug = 4;
    double price = 5;
    int32 quantity = 6;
    string category = 7;
    string image_cover = 8;
    string message = 9;
}
